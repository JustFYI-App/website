# Firebase Deployment Workflow
#
# Deploys Cloud Functions and Firestore security rules to Firebase
# when changes are pushed to the functions directory or firestore.rules.
#
# Prerequisites:
# 1. Create a Firebase service account in Firebase Console:
#    - Go to Project Settings > Service accounts
#    - Click "Generate new private key"
#    - Download the JSON file
#
# 2. Add the service account JSON as a GitHub secret:
#    - Go to repository Settings > Secrets and variables > Actions
#    - Create a new secret named FIREBASE_SERVICE_ACCOUNT
#    - Paste the entire JSON content of the service account file
#
# See functions/FIREBASE_SETUP.md for detailed setup instructions.

name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Cloud Functions'
        required: false
        default: true
        type: boolean
      deploy_rules:
        description: 'Deploy Firestore rules'
        required: false
        default: true
        type: boolean

env:
  # Firebase project ID (must match .firebaserc)
  FIREBASE_PROJECT_ID: justfyi-web
  # Node.js version (must match functions/package.json engines.node)
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: Lint and Test Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Firebase
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Only deploy if tests pass
    if: success()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      # Authenticate with Firebase using service account
      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Deploy based on what changed or manual input
      - name: Deploy Cloud Functions and Firestore rules
        if: github.event_name == 'push' || (github.event.inputs.deploy_functions == 'true' && github.event.inputs.deploy_rules == 'true')
        run: |
          firebase deploy --only functions,firestore:rules --project ${{ env.FIREBASE_PROJECT_ID }}

      - name: Deploy Cloud Functions only
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_functions == 'true' && github.event.inputs.deploy_rules == 'false'
        run: |
          firebase deploy --only functions --project ${{ env.FIREBASE_PROJECT_ID }}

      - name: Deploy Firestore rules only
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_functions == 'false' && github.event.inputs.deploy_rules == 'true'
        run: |
          firebase deploy --only firestore:rules --project ${{ env.FIREBASE_PROJECT_ID }}

      # Verify deployment
      - name: Verify function deployment
        run: |
          echo "Deployment complete!"
          echo "Function URL: https://europe-west1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/subscribe"
          echo ""
          echo "To test the endpoint, run:"
          echo "curl -X POST https://europe-west1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/subscribe \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  -H 'Origin: https://justfyi.app' \\"
          echo "  -d '{\"email\": \"test@example.com\", \"honeypot\": \"\"}'"
